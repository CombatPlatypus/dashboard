        <style>

            .drive-style {
                width: 100%;
                padding: 35px;
                border-radius: 5px;
                background-color: #1f1f1f;
                border: 2px solid #525252;
            }
            .login-warning {
                width: max-content;
                text-align: center;
                margin: auto;
            }
            .login-warning img {
                width: 200px;
            }
            .login-warning button {
                width: 450px;
            }

            /* BARRA DE NAVEGAÇÃO DO DRIVE */

            .drive-toolbar {
                width: max-content;
                margin: 0 auto;
                display: flex;
                align-items: center;
                column-gap: 15px;
                row-gap: 10px;
                flex-wrap: wrap;
            }
            .drive-breadcrumb {
                display: flex;
                align-items: center;
                column-gap: 8px;
                row-gap: 5px;
                flex-wrap: wrap;
            }
            .drive-toolbar button, .drive-breadcrumb-current, .drive-breadcrumb-separator {
                border: none;
                cursor: pointer;
                color: #e4e6eb;
                font-size: 15px;
                letter-spacing: 1px;
                font-family: 'Open Sans', sans-serif;
                font-weight: 400;
                text-rendering: optimizeLegibility;
                line-height: 1.6;
            }
           .drive-breadcrumb-current, .drive-breadcrumb-separator {
                cursor: default !important;
            }
            .drive-breadcrumb-separator {
                opacity: 0.6;
                user-select: none;
            }
            .drive-view-controls {
                width: max-content;
                margin: 30px auto 0px auto;
                height: 40px;
                overflow: hidden;
            }
            .drive-view-controls button {
                width: 125px;
                min-height: 40px;
                font-size: 14px;
                padding: 10px;
            }
            
            /* CARREGAMENTO DO GOOGLE DRIVE */

            .drive-loading {
                display: flex;
                align-items: center;
                justify-content: center;
                column-gap: 12px;
                min-height: 120px;
                font-size: 14px;
            }
            .drive-loading-spinner {
                width: 24px;
                height: 24px;
                border: 3px solid rgba(255, 255, 255, 0.25);
                border-top-color: currentColor;
                border-radius: 50%;
                animation: drive-spinner-rotation 0.8s linear infinite;
            }
            .drive-error {
                padding: 15px;
                border: 1px solid #d9534f;
                border-radius: 5px;
                color: #ff8a85;
            }
            @keyframes drive-spinner-rotation {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            /* INFORMAÇÕES DO USUÁRIO */

            #userInfo .who-is {
                width: max-content;
                column-gap: 20px;
                align-items: center;
            }
            #userInfo .who-is p, #userInfo .who-is p{
                margin: 0;
            }
            #userPhoto {
                border-radius: 5px;
            }

            /* DRIVE */

            .drive-section {
                background-color: #1f1f1f;
                border: 2px solid #525252;
                border-radius: 5px;
                padding: 30px;
            }
            .drive-section h2 {
                margin-bottom: 20px;
                text-align: center;
            }
            #driveFiles {
                display: flex;
                flex-direction: column;
                row-gap: 10px;
                overflow: auto;
                padding-right: 15px;
            }
            #driveFiles:-webkit-scrollbar-track {
                background-color: transparent;
            }
            #driveFiles::-webkit-scrollbar {
                width: 5px;
                background: transparent;
            }
            #driveFiles::-webkit-scrollbar-thumb {
                border-radius: 5px;
                background: #525252;
            }
            .drive-file {
                display: flex;
                align-items: center;
                column-gap: 12px;
                padding: 12px;
                color: #e4e6eb;
                text-decoration: none;
                border: 1px solid #525252;
                cursor: pointer;
            }
            .drive-file:hover {
                background-color: #2e2e2e;
            }
            .drive-file-icon {
                width: 32px;
                height: 32px;
                object-fit: contain;
            }
            .drive-file-info {
                display: flex;
                flex-direction: column;
                row-gap: 4px;
            }
            .drive-file-name {
                font-size: 15px;
            }
            .drive-file-date {
                font-size: 12px;
                opacity: 0.7;
            }
            #driveFiles.drive-list-view {
                display: flex;
                flex-direction: column;
                row-gap: 10px;
            }
            #driveFiles.drive-list-view .drive-file {
                display: flex;
                flex-direction: row;
                align-items: center;
                text-align: left;
                padding: 12px;
            }
            #driveFiles.drive-list-view .drive-file-icon {
                width: 32px;
                height: 32px;
                object-fit: contain;
            }
            #driveFiles.drive-grid-view {
                display: grid;
                grid-template-columns: repeat(auto-fill,minmax(220px, 1fr));
                gap: 18px;
            }
            #driveFiles.drive-grid-view .drive-file {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                padding: 20px;
                background-color: #1f1f1f;
                border: 2px solid #525252;
                border-radius: 5px;
                cursor: pointer;
            }
            #driveFiles.drive-grid-view .drive-file:hover {
                background-color: #2a2b2e;
            }
            #driveFiles.drive-grid-view .drive-file-icon {
                width: 100%;
                height: 150px;
                border-radius: 5px;
            }
            #driveFiles.drive-grid-view .drive-file-info {
                width: 100%;
                padding: 10px 6px 6px;
                row-gap: 5px;
            }
            #driveFiles.drive-grid-view .drive-file-name {
                display: block;
                width: 100%;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
                font-size: 14px;
            }

            #driveFiles.drive-grid-view .drive-file-date {
                font-size: 11px;
                opacity: 0.65;
            }
            #driveFiles.drive-grid-view .drive-folder .drive-file-icon {
                width: 80px;
                height: 100px;
                margin: 25px auto 10px;
                object-fit: contain;
            }
            #driveFiles.drive-grid-view .drive-folder {
                justify-content: center;
            }

            /*  VISUALIZADOR DE IMAGENS */

            .image-viewer {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 30px;
                background-color: rgba(0, 0, 0, 0.88);
            }
            .image-viewer[hidden] {
                display: none !important;
            }
            .image-viewer-content {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
            }
            .image-viewer-image {
                display: block;
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                user-select: none;
                -webkit-user-drag: none;
            }
            .image-viewer-close {
                position: absolute;
                top: 20px;
                right: 24px;
                z-index: 1;
                width: 44px;
                height: 44px;
                border: none;
                border-radius: 50%;
                background-color: rgba(255, 255, 255, 0.12);
                color: #ffffff;
                font-size: 32px;
                line-height: 1;
                cursor: pointer;
            }
            .image-viewer-close:hover {
                background-color: rgba(255, 255, 255, 0.22);
            }
            body.image-viewer-open {
                overflow: hidden;
            }
            .image-viewer-loading {
                position: absolute;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                color: #ffffff;
            }
            .image-viewer-loading[hidden] {
                display: none;
            }

            .image-viewer-spinner {
                width: 42px;
                height: 42px;
                border: 4px solid rgba(255, 255, 255, 0.25);
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: image-viewer-spin 0.8s linear infinite;
            }
            @keyframes image-viewer-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .image-viewer-image[hidden] {
                display: none;
            }

            /*  */

                background-color: #e4e6eb;
                border: 2px solid #a3a5a9;
            }
            .main-structure .tabs .main-spreadsheet label {
                color: #000;
            }

                </div>

            </div>
