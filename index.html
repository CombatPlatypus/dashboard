        <!-- ARQUIVOS CSS E ICONE -->

        <link rel="icon" href="images/spreadsheets-icon.svg">
        <link rel="stylesheet" href="css/foundation.css">

        <style>

            /* TABS */

            .tabs {
                width: max-content;
                column-gap: 10px;
                row-gap: 10px;
            }
            .tabs-title {
                display: block;
            }
            .tabs .tabs-title .flex-box-center {
                max-width: max-content;
                align-items: center;
                column-gap: 10px;
            }
            .tabs-title > a {
                border: 2px solid #525252;
            }
            .tabs-title a img {
                width: 40px;
            }
            .tabs-title label {
                cursor: pointer;
            }
            .tabs-title>a:hover {
                background: #2e2e2e;
            }
            .tabs-title>a:focus, .tabs-title>a[aria-selected='true'] {
                background-color: #2e2e2e
            }
            .tabs-content {
                width: 100%;
            }

            /* ESTILO DO DASHBOARD */

            .main-menu .standard-width {
                max-width: 1024px;
                align-items: center;
            }
            .main-menu h3, .main-menu p {
                margin: 0;
            }
            .main-menu p {
                font-size: 14px;
            }

            /* ESTRUTURA PRINCIPAL */

            .main-structure {
                height: 100vh;
            }
            .main-structure .tabs-content {
                margin: auto;
            }
            .main-structure .container-1 .tabs-content {
                background-color: #1f1f1f;    
                border-radius: 5px;
            }
            .main-structure .tabs-content #Drive {
                background-color: #ffffff;    
                border-radius: 5px;
            }
            .main-structure .flex-box-between {
                width: 100%;
                margin: auto;
            }
            .main-structure .container-1 {
                width: 84%;
            }
            .main-structure .container-2 {
                width: 15%;
                overflow: auto;
                padding-right: 10px;
            }
            .main-structure .container-2:-webkit-scrollbar-track {
                background-color: transparent;
            }
            .main-structure .container-2::-webkit-scrollbar {
                width: 5px;
                background: transparent;
            }
            .main-structure .container-2::-webkit-scrollbar-thumb {
                border-radius: 5px;
                background: #525252;
            }

            .main-structure .tabs, .main-structure .tabs .tabs-title {
                width: 100% !important;
            }
            .main-structure .tabs .tabs-title label {
                font-size: 14px;
                user-select: none;
            }
            .main-structure .container-1 .tabs-content, .main-structure .tabs-panel, .main-structure .flex-box-between, .main-structure .container-1, .main-structure .container-2, iframe {
                height: 100% !important;
            }

            iframe {
                width: 100%;
                height: auto;
                border-radius: 5px;
            }

            .link-button {
                border: 2px solid #525252;
            }
            .link-button:hover {
                background: #2e2e2e;
            }
            .link-button label{
                cursor: pointer;
            }
            .link-button .flex-box-center{
                align-items: center;
                column-gap: 10px;
            }
            
        </style>
    </head>
