        <style>

            /* TABS */

            .tabs {
                width: max-content;
                column-gap: 10px;
                row-gap: 10px;
            }
            .tabs-title {
                display: block;
            }
            .tabs .tabs-title .flex-box-center {
                max-width: max-content;
                align-items: center;
                column-gap: 10px;
            }
            .tabs-title > a {
                border: 2px solid #525252;
            }
            .tabs-title a img {
                width: 40px;
            }
            .tabs-title label {
                cursor: pointer;
            }
            .tabs-title>a:hover {
                background: #2e2e2e;
            }
            .tabs-title>a:focus, .tabs-title>a[aria-selected='true'] {
                background-color: #2e2e2e
            }
            .tabs-content {
                width: 100%;
            }

            /* ESTILO DO DASHBOARD */

            .main-menu .standard-width {
                max-width: 1024px;
                align-items: center;
            }
            .main-menu h3, .main-menu p {
                margin: 0;
            }
            .main-menu p {
                font-size: 14px;
            }

            /* ESTRUTURA PRINCIPAL */

            .main-structure {
                height: 100vh;
            }
            .main-structure .tabs-content {
                margin: auto;
            }
            .main-structure .container-1 .tabs-content {
                background-color: #1f1f1f;    
                border-radius: 5px;
            }
            .main-structure .tabs-content #Drive {
                /* background-color: #ffffff;     */
                border-radius: 5px;
            }
            .main-structure .flex-box-between {
                width: 100%;
                margin: auto;
            }
            .main-structure .container-1 {
                width: 84%;
            }
            .main-structure .container-2 {
                width: 15%;
                overflow: auto;
                padding-right: 10px;
            }
            .main-structure .container-2:-webkit-scrollbar-track {
                background-color: transparent;
            }
            .main-structure .container-2::-webkit-scrollbar {
                width: 5px;
                background: transparent;
            }
            .main-structure .container-2::-webkit-scrollbar-thumb {
                border-radius: 5px;
                background: #525252;
            }

            .main-structure .tabs, .main-structure .tabs .tabs-title {
                width: 100% !important;
            }
            .main-structure .tabs .tabs-title label {
                font-size: 14px;
                user-select: none;
            }
            .main-structure .container-1 .tabs-content, .main-structure .tabs-panel, .main-structure .flex-box-between, .main-structure .container-1, .main-structure .container-2, iframe {
                height: 100% !important;
            }

            iframe {
                width: 100%;
                height: auto;
                border-radius: 5px;
            }

            .link-button {
                border: 2px solid #525252;
            }
            .link-button:hover {
                background: #2e2e2e;
            }
            .link-button label{
                cursor: pointer;
            }
            .link-button .flex-box-center{
                align-items: center;
                column-gap: 10px;
            }

            [hidden] {
                display: none !important;
            }




            /* BARRA DE NAVEGAÇÃO DO DRIVE */

            .drive-toolbar {
                display: flex;
                align-items: center;
                column-gap: 15px;
                row-gap: 10px;

                margin-bottom: 15px;

                flex-wrap: wrap;
            }

            .drive-toolbar .button {
                margin: 0;
            }

            .drive-breadcrumb {
                display: flex;
                align-items: center;
                column-gap: 8px;
                row-gap: 5px;

                flex-wrap: wrap;
            }

            .drive-breadcrumb-button {
                padding: 0;

                color: inherit;
                font-size: 14px;

                background: transparent;
                border: none;

                cursor: pointer;
            }

            .drive-breadcrumb-button:hover {
                text-decoration: underline;
            }

            .drive-breadcrumb-current {
                font-size: 14px;
                font-weight: bold;
            }

            .drive-breadcrumb-separator {
                font-size: 14px;
                opacity: 0.6;
                user-select: none;
            }

            /* CARREGAMENTO DO GOOGLE DRIVE */

            .drive-loading {
                display: flex;
                align-items: center;
                justify-content: center;
                column-gap: 12px;

                min-height: 120px;

                font-size: 14px;
            }

            .drive-loading-spinner {
                width: 24px;
                height: 24px;

                border: 3px solid rgba(255, 255, 255, 0.25);
                border-top-color: currentColor;
                border-radius: 50%;

                animation: drive-spinner-rotation 0.8s linear infinite;
            }

            .drive-error {
                padding: 15px;

                border: 1px solid #d9534f;
                border-radius: 5px;

                color: #ff8a85;
            }

            @keyframes drive-spinner-rotation {

                from {
                    transform: rotate(0deg);
                }

                to {
                    transform: rotate(360deg);
                }

            }

            /* DRIVE */

            .drive-section {
                padding: 20px;
            }

            #driveFiles {
                display: flex;
                flex-direction: column;
                row-gap: 10px;
            }

            .drive-file {
                display: flex;
                align-items: center;
                column-gap: 12px;

                padding: 12px;

                color: inherit;
                text-decoration: none;

                border: 1px solid #ddd;
                border-radius: 6px;
            }

            .drive-file:hover {
                background-color: #f5f5f5;
            }

            .drive-file-icon {
                width: 32px;
                height: 32px;
                object-fit: contain;
            }

            .drive-file-info {
                display: flex;
                flex-direction: column;
                row-gap: 4px;
            }

            .drive-file-name {
                font-size: 15px;
            }

            .drive-file-date {
                font-size: 12px;
                opacity: 0.7;
            }



#driveFiles.drive-list-view {
    display: flex;
    flex-direction: column;
    row-gap: 10px;
}

#driveFiles.drive-list-view .drive-file {
    display: flex;
    flex-direction: row;
    align-items: center;

    padding: 12px;
}

#driveFiles.drive-list-view .drive-file-icon {
    width: 32px;
    height: 32px;

    object-fit: contain;
}


            #driveFiles.drive-grid-view {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px, 1fr)
        );

    gap: 18px;
}

#driveFiles.drive-grid-view .drive-file {
    display: flex;
    flex-direction: column;
    align-items: stretch;

    padding: 8px;

    overflow: hidden;

    background-color: #202124;
    border: 1px solid #3c4043;
    border-radius: 10px;

    text-align: left;
}

#driveFiles.drive-grid-view .drive-file:hover {
    background-color: #2a2b2e;
}

#driveFiles.drive-grid-view .drive-file-icon {
    width: 100%;
    height: 170px;

    object-fit: cover;

    background-color: #303134;
    border-radius: 7px;
}

#driveFiles.drive-grid-view .drive-file-info {
    width: 100%;

    padding: 10px 6px 6px;

    row-gap: 5px;
}

#driveFiles.drive-grid-view .drive-file-name {
    display: block;

    width: 100%;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 14px;
}

#driveFiles.drive-grid-view .drive-file-date {
    font-size: 11px;
    opacity: 0.65;
}


#driveFiles.drive-grid-view .drive-folder .drive-file-icon {
    width: 80px;
    height: 100px;

    margin: 25px auto 10px;

    object-fit: contain;
}

#driveFiles.drive-grid-view .drive-folder {
    justify-content: center;
}

                        
        </style>
